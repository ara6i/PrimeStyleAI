name: Deploy to DigitalOcean

concurrency:
  group: primestyleai-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -euo pipefail

            APP_DIR="/var/www/prime-products"
            REPO_URL="git@github.com:${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"
            RELEASE_DIR=".next-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            BUILD_DIR=".next-production-build"
            LEGACY_BUILD_CACHE_DIR=".next-build-cache"
            DEPENDENCY_HASH_FILE=".deploy-package-lock.sha256"
            TSCONFIG_BACKUP="/tmp/prime-products-tsconfig-${{ github.run_id }}-${{ github.run_attempt }}.json"
            PREVIOUS_DIST=""
            PAUSABLE_SERVICES=(
              prime-products-test
              primestyle-backend-test
              primestyle-pdp-studio-worker
              prime-preview
            )
            PAUSED_SERVICES=()

            restore_services() {
              if [ -f "$TSCONFIG_BACKUP" ]; then
                cp "$TSCONFIG_BACKUP" "$APP_DIR/tsconfig.json"
              fi

              for service in "${PAUSED_SERVICES[@]}"; do
                pm2 start "$service" >/dev/null 2>&1 || true
              done
            }

            trap restore_services EXIT

            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning fresh..."
              mkdir -p /var/www
              cd /var/www
              git clone "$REPO_URL" prime-products
              cd prime-products
              git checkout "$BRANCH"
            else
              echo "Resetting to origin/$BRANCH..."
              cd "$APP_DIR"
              PREVIOUS_DIST="$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name==="prime-products");process.stdout.write(p?.pm2_env?.PRIME_PRODUCTS_DIST_DIR||p?.pm2_env?.env?.PRIME_PRODUCTS_DIST_DIR||"")})' 2>/dev/null || true)"
              git fetch origin
              git reset --hard "origin/$BRANCH"
            fi

            package_lock_hash="$(sha256sum package-lock.json | awk '{print $1}')"
            if [ ! -d node_modules ] || [ ! -f "$DEPENDENCY_HASH_FILE" ] || [ "$(cat "$DEPENDENCY_HASH_FILE")" != "$package_lock_hash" ]; then
              echo "Installing changed dependencies..."
              npm ci
              printf '%s\n' "$package_lock_hash" > "$DEPENDENCY_HASH_FILE"
            else
              echo "Dependencies unchanged; reusing node_modules."
            fi

            cp tsconfig.json "$TSCONFIG_BACKUP"

            echo "Temporarily pausing test and preview processes for build memory..."
            for service in "${PAUSABLE_SERVICES[@]}"; do
              if pm2 describe "$service" >/dev/null 2>&1 && \
                [ "$(pm2 jlist | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.name===process.argv[1]);process.stdout.write(p?.pm2_env?.status||"")})' "$service")" = "online" ]; then
                pm2 stop "$service" >/dev/null
                PAUSED_SERVICES+=("$service")
              fi
            done

            if [ ! -d "$BUILD_DIR/cache" ]; then
              mkdir -p "$BUILD_DIR"
              if [ -d "$LEGACY_BUILD_CACHE_DIR" ]; then
                echo "Seeding the stable Next.js build directory from the legacy cache..."
                cp -al "$LEGACY_BUILD_CACHE_DIR" "$BUILD_DIR/cache"
              elif [ -n "$PREVIOUS_DIST" ] && [ -d "$PREVIOUS_DIST/cache" ]; then
                echo "Seeding the stable Next.js build directory from $PREVIOUS_DIST..."
                cp -al "$PREVIOUS_DIST/cache" "$BUILD_DIR/cache"
              fi
            fi

            echo "Building in the stable cache-aware directory $BUILD_DIR..."
            NODE_OPTIONS=--max-old-space-size=4096 \
              PRIME_PRODUCTS_DIST_DIR="$BUILD_DIR" \
              PRIME_PRODUCTS_LOW_MEMORY_BUILD=true \
              npm run build

            echo "Snapshotting the runnable release without duplicating the build cache..."
            mkdir -p "$RELEASE_DIR"
            rsync -a --delete --exclude='/cache/' "$BUILD_DIR/" "$RELEASE_DIR/"
            mkdir -p "$RELEASE_DIR/cache/images"

            echo "Publishing merchant static site..."
            PRIME_PRODUCTS_LOW_MEMORY_BUILD=true \
              MERCHANT_RELEASE_LABEL="$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}" \
              bash scripts/deploy-merchant-static.sh

            echo "Publishing creator static site..."
            PRIME_PRODUCTS_LOW_MEMORY_BUILD=true \
              CREATOR_RELEASE_LABEL="$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}" \
              bash scripts/deploy-creator-static.sh

            echo "Restarting PM2..."
            if pm2 describe prime-products > /dev/null 2>&1; then
              PRIME_PRODUCTS_DIST_DIR="$RELEASE_DIR" pm2 restart prime-products --update-env
            else
              PRIME_PRODUCTS_DIST_DIR="$RELEASE_DIR" PORT=3001 pm2 start npm --name "prime-products" -- start
            fi

            live_healthy=false
            for attempt in {1..15}; do
              if curl --fail --silent --max-time 5 http://127.0.0.1:3001/ >/dev/null; then
                live_healthy=true
                break
              fi
              sleep 2
            done

            if [ "$live_healthy" != "true" ]; then
              echo "Live health check did not recover after the PM2 restart." >&2
              exit 1
            fi

            if [ -n "$PREVIOUS_DIST" ] && [ "$PREVIOUS_DIST" != "$RELEASE_DIR" ] && [[ "$PREVIOUS_DIST" == .next-release-* ]] && [ -d "$PREVIOUS_DIST/cache/webpack" ]; then
              echo "Removing the previous release's disposable webpack cache..."
              rm -rf -- "$PREVIOUS_DIST/cache/webpack"
            fi

            for release_candidate in .next-release-*; do
              if [ ! -d "$release_candidate" ] || [ "$release_candidate" = "$RELEASE_DIR" ] || [ "$release_candidate" = "$PREVIOUS_DIST" ]; then
                continue
              fi
              echo "Removing stale build release $release_candidate..."
              rm -rf -- "$release_candidate"
            done

            if [ -d "$LEGACY_BUILD_CACHE_DIR" ]; then
              echo "Removing the superseded legacy build cache..."
              rm -rf -- "$LEGACY_BUILD_CACHE_DIR"
            fi

            restore_services
            trap - EXIT
            pm2 save

            echo "Deployment complete!"
